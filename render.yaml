services:
  - type: web
    name: api-free-fire
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: freefire-db
          property: connectionString
databases:
  - name: freefire-db
    plan: free
    databaseName: freefire
    user: freefire
